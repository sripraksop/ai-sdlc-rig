name: ams-reviewer
version: "1.0"
description: ASDLC AMS Reviewer (Codex) - reviews designer designs and developer code before human review

defaults:
  runtime: codex
  lifecycle:
    execution_mode: interactive_resident
    compaction_strategy: default-compaction
    restore_policy: resume_if_possible

profiles:
  default:
    uses:
      guidance: [role]
      # shared skills live in the rig-level skills/ folder and are discovered at launch;
      # role-only skills are declared under resources.skills
      skills: [ams-ticket-workflow, openapi-contract, test-strategy, ui-design-system, solution-design, react-frontend, aspnetcore-backend, dotnet-testing, design-review, code-review]

resources:
  guidance:
    - id: role
      path: guidance/role.md
  skills:
    - id: design-review
      path: skills/design-review
    - id: code-review
      path: skills/code-review

startup:
  files:
    - path: guidance/role.md
      delivery_hint: guidance_merge   # CLAUDE.md for claude-code, AGENTS.md for codex
      required: true
